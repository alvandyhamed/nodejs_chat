<!DOCTYPE html>
<html>
<head>
    <title>چت</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('private')">چت خصوصی</button>
            <button class="tab" onclick="switchTab('group')">چت گروهی</button>
            <button class="tab" onclick="switchTab('channel')">کانال</button>
        </div>

        <div class="online-users">
            <h3>کاربران آنلاین (<span id="onlineCount">0</span>)</h3>
            <ul id="onlineUsers"></ul>
        </div>

        <div id="privateChat" class="tab-content active">
            <div class="messages" id="privateMessages"></div>
            <div class="input-box">
                <select id="privateRecipient"></select>
                <input type="text" id="privateInput" placeholder="پیام خصوصی...">
                <button onclick="sendPrivateMessage()">ارسال</button>
            </div>
        </div>

        <div id="groupChat" class="tab-content">
            <div class="messages" id="groupMessages"></div>
            <div class="input-box">
                <input type="text" id="groupInput" placeholder="پیام گروهی...">
                <button onclick="sendGroupMessage()">ارسال</button>
            </div>
        </div>

        <div id="channel" class="tab-content">
            <div id="channelAdminPanel"></div>
            <div id="channelList" class="channel-list"></div>
            <div class="messages" id="channelMessages"></div>
            <div class="input-box">
                <input type="text" id="channelInput" placeholder="پیام خود را بنویسید...">
                <button id="channelButton" onclick="sendChannelMessage()">ارسال</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io('http://localhost:3000');
        const username = localStorage.getItem('username');
        let privateChatHistory = {}; // {username: [msgHtml, ...]}
        let groupChatHistory = [];
        let channelChatHistory = {}; // {channelName: [msgHtml, ...]}
        let currentRecipient = null;
        let currentChannel = null;
        let allUsers = [];
        let userChannels = [];
        let replyToMessageId = null;
        let forwardFromMessageId = null;
        let forwardTarget = null; // {type: 'private'|'group'|'channel', to: ...}

        // اعتبارسنجی اولیه
        if (!username || username.trim() === '') {
            alert('دسترسی غیرمجاز!');
            window.location.href = '/';
        }

        // مدیریت تب‌ها
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            if(tabName === 'private') document.getElementById('privateChat')?.classList.add('active');
            if(tabName === 'group') document.getElementById('groupChat')?.classList.add('active');
            if(tabName === 'channel') document.getElementById('channel')?.classList.add('active');
            document.querySelector(`.tab[onclick="switchTab('${tabName}')"]`)?.classList.add('active');
        }

        // دریافت لیست کاربران آنلاین و آفلاین
        socket.on('all-users', users => {
            allUsers = users;
            const onlineUsers = users.filter(u => u.isOnline && u.username !== username);
            const offlineUsers = users.filter(u => !u.isOnline && u.username !== username);
            // نمایش کاربران آنلاین
            document.getElementById('onlineUsers').innerHTML = onlineUsers
                .map(user => `<li onclick="selectRecipient('${user.username}')">${user.username}</li>`)
                .join('');
            // نمایش تعداد آنلاین
            document.getElementById('onlineCount').textContent = onlineUsers.length;
            // نمایش کاربران آفلاین (در صورت نیاز می‌توانید یک لیست جدا اضافه کنید)
            // ...
            // به‌روزرسانی انتخاب‌گر دریافت‌کننده چت خصوصی
            const recipientSelect = document.getElementById('privateRecipient');
            recipientSelect.innerHTML = `
                <option value="">انتخاب کاربر...</option>
                ${onlineUsers.map(user => `<option value="${user.username}">${user.username}</option>`).join('')}
            `;
            renderChannelAdminPanel();
        });

        // دریافت تاریخچه چت
        socket.on('chat-history', messages => {
            // پاک‌سازی تاریخچه‌ها
            privateChatHistory = {};
            groupChatHistory = [];
            channelChatHistory = {};
            // دسته‌بندی پیام‌ها
            messages.forEach(msg => {
                if (msg.type === 'private') {
                    const other = msg.from === username ? msg.to : msg.from;
                    if (!privateChatHistory[other]) privateChatHistory[other] = [];
                    privateChatHistory[other].push(enrichMessage(msg, 'private'));
                } else if (msg.type === 'group') {
                    groupChatHistory.push(enrichMessage(msg, 'group'));
                } else if (msg.type === 'channel') {
                    if (!channelChatHistory[msg.to]) channelChatHistory[msg.to] = [];
                    channelChatHistory[msg.to].push(enrichMessage(msg, 'channel'));
                }
            });
            // نمایش تاریخچه فعلی (در صورت انتخاب)
            showPrivateChatHistory();
            showGroupChatHistory();
            showChannelChatHistory();
        });

        // دریافت لیست کانال‌های کاربر
        socket.on('user-channels', channels => {
            console.log('user-channels:', channels);
            userChannels = channels;
            const channelListDiv = document.getElementById('channelList');
            if (!channels.length) {
                channelListDiv.innerHTML = '<div class="no-channel">شما در هیچ کانالی عضو نیستید.</div>';
                currentChannel = null;
                showChannelChatHistory();
                document.getElementById('channelInput').disabled = true;
                document.getElementById('channelButton').disabled = true;
                return;
            }
            channelListDiv.innerHTML = channels.map(c =>
                `<button class="channel-item${currentChannel === c.name ? ' active' : ''}" onclick="selectChannel('${c.name}')">${c.name}</button>`
            ).join(' ');
            // اگر کانال فعال نداریم، اولین کانال را انتخاب کن
            if (!currentChannel || !channels.some(c => c.name === currentChannel)) {
                selectChannel(channels[0].name);
            }
            renderChannelAdminPanel();
        });

        // تابع ساخت HTML پیام با دکمه‌های reply/forward/like و نمایش reply/forward
        function buildMessageHtml(msg, contextType = 'private') {
            // مقداردهی پیش‌فرض برای فیلدها
            const sender = msg.from || 'نامشخص';
            const text = msg.message || msg.content || '';
            const id = msg._id || msg.id || '';
            if (!id) {
                console.warn('پیام بدون id:', msg);
            }
            let replyHtml = '';
            let forwardHtml = '';
            if (msg.replyTo && msg.replyToText) {
                replyHtml = `<div class="reply-ref" style="background:#e3f0ff; border-radius:6px; padding:2px 8px; margin-bottom:3px; color:#2196f3;">پاسخ به: <span>${msg.replyToText}</span></div>`;
            }
            if (msg.forwardedFrom && msg.forwardedFromText) {
                forwardHtml = `<div class="forward-ref" style="background:#e6ffe3; border-radius:6px; padding:2px 8px; margin-bottom:3px; color:#43a047;">
                    فروارد از: <span>${msg.forwardedFromUser ? msg.forwardedFromUser + ' - ' : ''}${msg.forwardedFromText}</span>
                </div>`;
            }
            let likeCount = Array.isArray(msg.likes) ? msg.likes.length : 0;
            let likeBtn = id ? `<button class="like-btn" style="background:#e3f0ff; color:#2196f3; border:none; border-radius:5px; padding:2px 8px; margin-right:2px; cursor:pointer;" onclick="likeMessage('${id}')">❤️ ${likeCount}</button>` : '<button class="like-btn" disabled>❤️</button>';
            let replyBtn = id ? `<button class="reply-btn" style="background:#2196f3; color:#fff; border:none; border-radius:5px; padding:2px 8px; margin-right:2px; cursor:pointer;" onclick="setReply('${id}', '${contextType}')">پاسخ</button>` : '';
            let forwardBtn = id ? `<button class="forward-btn" style="background:#43a047; color:#fff; border:none; border-radius:5px; padding:2px 8px; margin-right:2px; cursor:pointer;" onclick="setForward('${id}', '${contextType}')">فوروارد</button>` : '';

            // باکس ریپلای
            let replyBox = '';
            if (replyToMessageId === id) {
                replyBox = `
                    <div class="reply-box" style="background:#e3f0ff; border-radius:8px; padding:8px; margin-top:5px; display:flex; gap:5px; align-items:center;">
                        <input type="text" id="replyInput_${id}" placeholder="پاسخ خود را بنویسید..." style="flex:1; border:1px solid #2196f3; border-radius:5px; padding:4px;">
                        <button style="background:#2196f3; color:#fff; border:none; border-radius:5px; padding:4px 12px; cursor:pointer;" onclick="sendReply('${id}', '${contextType}')">ارسال پاسخ</button>
                        <button style="background:#fff; color:#2196f3; border:1px solid #2196f3; border-radius:5px; padding:4px 8px; cursor:pointer;" onclick="clearReplyForward()">لغو</button>
                    </div>
                `;
            }
            // باکس فوروارد
            let forwardBox = '';
            if (forwardFromMessageId === id) {
                forwardBox = `
                    <div class="forward-box" style="background:#e6ffe3; border-radius:8px; padding:8px; margin-top:5px; display:flex; gap:5px; align-items:center;">
                        <select id="forwardSelect_${id}" style="flex:1; border:1px solid #43a047; border-radius:5px; padding:4px;">
                            ${getForwardOptions().map(opt => `<option value="${opt.value}">${opt.label}</option>`).join('')}
                        </select>
                        <button style="background:#43a047; color:#fff; border:none; border-radius:5px; padding:4px 12px; cursor:pointer;" onclick="sendForward('${id}', '${contextType}')">ارسال فوروارد</button>
                        <button style="background:#fff; color:#43a047; border:1px solid #43a047; border-radius:5px; padding:4px 8px; cursor:pointer;" onclick="clearReplyForward()">لغو</button>
                    </div>
                `;
            }
            return `
                <div class="message ${sender === username ? 'my-message' : ''}">
                    ${replyHtml}
                    ${forwardHtml}
                    <span class="sender">${sender === username ? 'شما' : sender}:</span>
                    <div class="text">${text}</div>
                    <div class="msg-actions">${replyBtn} ${forwardBtn} ${likeBtn}</div>
                    ${replyBox}
                    ${forwardBox}
                </div>
            `;
        }

        // نمایش تاریخچه چت خصوصی
        function showPrivateChatHistory() {
            const messagesDiv = document.getElementById('privateMessages');
            const arr = privateChatHistory[currentRecipient] || [];
            messagesDiv.innerHTML = arr.map(msg => buildMessageHtml(msg, 'private')).join('') || 'هیچ پیامی موجود نیست.';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            // نمایش وضعیت ریپلای بالای input
            const inputBox = document.querySelector('#privateChat .input-box');
            let replyStatus = document.getElementById('replyStatusBox');
            if (replyToMessageId) {
                const msg = arr.find(m => (m._id || m.id) === replyToMessageId);
                if (!replyStatus) {
                    replyStatus = document.createElement('div');
                    replyStatus.id = 'replyStatusBox';
                    replyStatus.style.background = '#e3f0ff';
                    replyStatus.style.color = '#2196f3';
                    replyStatus.style.padding = '4px 8px';
                    replyStatus.style.borderRadius = '6px';
                    replyStatus.style.marginBottom = '4px';
                    inputBox.prepend(replyStatus);
                }
                replyStatus.innerHTML = `در حال پاسخ به: <b>${msg ? (msg.message || msg.content) : ''}</b> <button onclick=\"clearReplyForward()\" style=\"background:#fff; color:#2196f3; border:1px solid #2196f3; border-radius:5px; padding:2px 8px; margin-right:8px; cursor:pointer;\">لغو</button>`;
            } else if (replyStatus) {
                replyStatus.remove();
            }
        }
        // نمایش تاریخچه گروهی
        function showGroupChatHistory() {
            const messagesDiv = document.getElementById('groupMessages');
            messagesDiv.innerHTML = groupChatHistory.map(msg => buildMessageHtml(msg, 'group')).join('') || 'هیچ پیامی موجود نیست.';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            // نمایش وضعیت ریپلای بالای input
            const inputBox = document.querySelector('#groupChat .input-box');
            let replyStatus = document.getElementById('replyStatusBoxGroup');
            if (replyToMessageId) {
                const msg = groupChatHistory.find(m => (m._id || m.id) === replyToMessageId);
                if (!replyStatus) {
                    replyStatus = document.createElement('div');
                    replyStatus.id = 'replyStatusBoxGroup';
                    replyStatus.style.background = '#e3f0ff';
                    replyStatus.style.color = '#2196f3';
                    replyStatus.style.padding = '4px 8px';
                    replyStatus.style.borderRadius = '6px';
                    replyStatus.style.marginBottom = '4px';
                    inputBox.prepend(replyStatus);
                }
                replyStatus.innerHTML = `در حال پاسخ به: <b>${msg ? (msg.message || msg.content) : ''}</b> <button onclick=\"clearReplyForward()\" style=\"background:#fff; color:#2196f3; border:1px solid #2196f3; border-radius:5px; padding:2px 8px; margin-right:8px; cursor:pointer;\">لغو</button>`;
            } else if (replyStatus) {
                replyStatus.remove();
            }
        }
        // نمایش تاریخچه کانال
        function showChannelChatHistory() {
            const messagesDiv = document.getElementById('channelMessages');
            const arr = channelChatHistory[currentChannel] || [];
            messagesDiv.innerHTML = arr.map(msg => buildMessageHtml(msg, 'channel')).join('') || 'هیچ پیامی موجود نیست.';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            // نمایش وضعیت ریپلای بالای input
            const inputBox = document.querySelector('#channel .input-box');
            let replyStatus = document.getElementById('replyStatusBoxChannel');
            if (replyToMessageId) {
                const msg = arr.find(m => (m._id || m.id) === replyToMessageId);
                if (!replyStatus) {
                    replyStatus = document.createElement('div');
                    replyStatus.id = 'replyStatusBoxChannel';
                    replyStatus.style.background = '#e3f0ff';
                    replyStatus.style.color = '#2196f3';
                    replyStatus.style.padding = '4px 8px';
                    replyStatus.style.borderRadius = '6px';
                    replyStatus.style.marginBottom = '4px';
                    inputBox.prepend(replyStatus);
                }
                replyStatus.innerHTML = `در حال پاسخ به: <b>${msg ? (msg.message || msg.content) : ''}</b> <button onclick=\"clearReplyForward()\" style=\"background:#fff; color:#2196f3; border:1px solid #2196f3; border-radius:5px; padding:2px 8px; margin-right:8px; cursor:pointer;\">لغو</button>`;
            } else if (replyStatus) {
                replyStatus.remove();
            }
        }

        // انتخاب دریافت‌کننده چت خصوصی
        window.selectRecipient = (recipient) => {
            currentRecipient = recipient;
            document.getElementById('privateRecipient').value = recipient;
            showPrivateChatHistory();
        };
        document.getElementById('privateRecipient').addEventListener('change', function() {
            currentRecipient = this.value;
            showPrivateChatHistory();
        });

        // نمایش وضعیت reply/forward
        function ensureReplyIndicator() {
            let ind = document.getElementById('replyIndicator');
            if (!ind) {
                ind = document.createElement('div');
                ind.id = 'replyIndicator';
                ind.style.color = 'blue';
                ind.style.margin = '5px';
                // اضافه کردن به ابتدای chat-container
                document.querySelector('.chat-container').prepend(ind);
            }
        }
        ensureReplyIndicator();

        // ست کردن reply
        window.setReply = (msgId, contextType) => {
            console.log('setReply', { msgId, contextType, prev: replyToMessageId });
            if (replyToMessageId === msgId) {
                clearReplyForward();
            } else {
                replyToMessageId = msgId;
                forwardFromMessageId = null;
                forwardTarget = null;
                if (contextType === 'private') showPrivateChatHistory();
                else if (contextType === 'group') showGroupChatHistory();
                else if (contextType === 'channel') showChannelChatHistory();
            }
        };
        // ست کردن forward
        window.setForward = (msgId, contextType) => {
            console.log('setForward', { msgId, contextType, prev: forwardFromMessageId });
            if (forwardFromMessageId === msgId) {
                clearReplyForward();
            } else {
                forwardFromMessageId = msgId;
                replyToMessageId = null;
                forwardTarget = { type: contextType };
                if (contextType === 'private') showPrivateChatHistory();
                else if (contextType === 'group') showGroupChatHistory();
                else if (contextType === 'channel') showChannelChatHistory();
            }
        };
        // پاک کردن حالت reply/forward
        window.clearReplyForward = () => {
            ensureReplyIndicator();
            replyToMessageId = null;
            forwardFromMessageId = null;
            forwardTarget = null;
            document.getElementById('replyIndicator').textContent = '';
        };
        // لایک پیام
        window.likeMessage = async (msgId) => {
            try {
                const res = await fetch(`/api/message/${msgId}/like`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await res.json();
                if (!res.ok) return alert(data.error || 'خطا در لایک پیام');
            } catch (err) {
                alert('خطا در لایک پیام');
            }
        };
        // دریافت رویداد لایک شدن پیام
        socket.on('message-liked', data => {
            // پیام مربوطه را در آرایه‌ها پیدا و لایک‌ها را به‌روزرسانی کن
            [privateChatHistory, groupChatHistory, channelChatHistory].forEach(hist => {
                if (Array.isArray(hist)) {
                    hist.forEach(msg => { if (msg._id === data.messageId) msg.likes = data.likes; });
                } else if (typeof hist === 'object') {
                    Object.values(hist).forEach(arr => arr.forEach(msg => { if (msg._id === data.messageId) msg.likes = data.likes; }));
                }
            });
            showPrivateChatHistory();
            showGroupChatHistory();
            showChannelChatHistory();
        });

        // دریافت پیام خصوصی زنده
        socket.on('private-message', data => {
            if (!data) return;
            const key = data.from === username ? data.to : data.from;
            if (!privateChatHistory[key]) privateChatHistory[key] = [];
            const msg = enrichMessage({ ...data }, 'private');
            privateChatHistory[key].push(msg);
            if (currentRecipient === key) showPrivateChatHistory();
        });
        // دریافت پیام گروهی زنده
        socket.on('group-message', data => {
            if (!data) return;
            const msg = enrichMessage({ ...data }, 'group');
            groupChatHistory.push(msg);
            showGroupChatHistory();
        });
        // دریافت پیام کانال زنده
        socket.on('channel-message', data => {
            if (!data) return;
            if (!channelChatHistory[data.channel]) channelChatHistory[data.channel] = [];
            const msg = enrichMessage({ ...data }, 'channel');
            channelChatHistory[data.channel].push(msg);
            if (currentChannel === data.channel) showChannelChatHistory();
        });

        // ارسال پیام خصوصی با API (پشتیبانی از reply/forward)
        window.sendPrivateMessage = async () => {
            const recipient = document.getElementById('privateRecipient').value;
            const message = document.getElementById('privateInput').value.trim();
            if (!recipient) return alert('کاربر را انتخاب کنید!');
            if (!message) return;
            try {
                const res = await fetch('/api/message/private', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        from: username,
                        to: recipient,
                        message,
                        replyTo: replyToMessageId || null,
                        forwardedFrom: forwardFromMessageId || null
                    })
                });
                const data = await res.json();
                if (!res.ok) return alert(data.error || 'خطا در ارسال پیام خصوصی');
                document.getElementById('privateInput').value = '';
                clearReplyForward();
                // افزودن پیام ارسالی به تاریخچه سمت خود کاربر
                const msgObj = {
                    _id: data.messageId || Date.now().toString(),
                    from: username,
                    to: recipient,
                    content: message,
                    type: 'private',
                    likes: [],
                    timestamp: new Date().toISOString(),
                    replyTo: replyToMessageId || null,
                    forwardedFrom: forwardFromMessageId || null
                };
                const enrichedMsg = enrichMessage(msgObj, 'private');
                if (!privateChatHistory[recipient]) privateChatHistory[recipient] = [];
                privateChatHistory[recipient].push(enrichedMsg);
                showPrivateChatHistory();
            } catch (err) {
                alert('خطا در ارسال پیام خصوصی');
            }
        };
        // ارسال پیام گروهی با API (پشتیبانی از reply/forward)
        window.sendGroupMessage = async () => {
            const message = document.getElementById('groupInput').value.trim();
            if (!message) return;
            try {
                const res = await fetch('/api/message/group', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        from: username,
                        message,
                        replyTo: replyToMessageId || null,
                        forwardedFrom: forwardFromMessageId || null
                    })
                });
                const data = await res.json();
                if (!res.ok) return alert(data.error || 'خطا در ارسال پیام گروهی');
                document.getElementById('groupInput').value = '';
                clearReplyForward();
                // افزودن پیام ارسالی به تاریخچه سمت خود کاربر
                const msgObj = {
                    _id: data.messageId || Date.now().toString(),
                    from: username,
                    content: message,
                    type: 'group',
                    likes: [],
                    timestamp: new Date().toISOString(),
                    replyTo: replyToMessageId || null,
                    forwardedFrom: forwardFromMessageId || null
                };
                const enrichedMsg = enrichMessage(msgObj, 'group');
                groupChatHistory.push(enrichedMsg);
                showGroupChatHistory();
            } catch (err) {
                alert('خطا در ارسال پیام گروهی');
            }
        };
        // ارسال پیام کانال با API (پشتیبانی از reply/forward)
        window.sendChannelMessage = async () => {
            const message = document.getElementById('channelInput').value.trim();
            if (!message || !currentChannel) return;
            try {
                const res = await fetch('/api/message/channel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        from: username,
                        channelName: currentChannel,
                        message,
                        replyTo: replyToMessageId || null,
                        forwardedFrom: forwardFromMessageId || null
                    })
                });
                const data = await res.json();
                if (!res.ok) return alert(data.error || 'خطا در ارسال پیام کانال');
                document.getElementById('channelInput').value = '';
                clearReplyForward();
                // افزودن پیام ارسالی به تاریخچه سمت خود کاربر
                const msgObj = {
                    _id: data.messageId || Date.now().toString(),
                    from: username,
                    to: currentChannel,
                    content: message,
                    type: 'channel',
                    likes: [],
                    timestamp: new Date().toISOString(),
                    replyTo: replyToMessageId || null,
                    forwardedFrom: forwardFromMessageId || null
                };
                const enrichedMsg = enrichMessage(msgObj, 'channel');
                if (!channelChatHistory[currentChannel]) channelChatHistory[currentChannel] = [];
                channelChatHistory[currentChannel].push(enrichedMsg);
                showChannelChatHistory();
            } catch (err) {
                alert('خطا در ارسال پیام کانال');
            }
        };

        // هنگام دریافت پیام، اگر replyTo یا forwardedFrom داشت، متن پیام اصلی را پیدا کن و به msg اضافه کن
        function enrichMessage(msg, contextType) {
            msg._id = msg._id || msg.id || '';
            msg.from = msg.from || 'نامشخص';
            msg.message = msg.message || msg.content || '';
            msg.likes = Array.isArray(msg.likes) ? msg.likes : [];
            if (msg.replyTo) {
                let refMsg = null;
                if (contextType === 'private') {
                    Object.values(privateChatHistory).forEach(arr => {
                        if (!refMsg) refMsg = arr.find(m => (m._id || m.id) === msg.replyTo);
                    });
                } else if (contextType === 'group') {
                    refMsg = groupChatHistory.find(m => (m._id || m.id) === msg.replyTo);
                } else if (contextType === 'channel') {
                    Object.values(channelChatHistory).forEach(arr => {
                        if (!refMsg) refMsg = arr.find(m => (m._id || m.id) === msg.replyTo);
                    });
                }
                msg.replyToText = refMsg ? (refMsg.message || refMsg.content) : (msg.replyToText || 'پیام قبلی');
                msg.replyToUser = refMsg ? (refMsg.from || 'نامشخص') : (msg.replyToUser || '');
            }
            if (msg.forwardedFrom) {
                let refMsg = null;
                if (contextType === 'private') {
                    Object.values(privateChatHistory).forEach(arr => {
                        if (!refMsg) refMsg = arr.find(m => (m._id || m.id) === msg.forwardedFrom);
                    });
                } else if (contextType === 'group') {
                    refMsg = groupChatHistory.find(m => (m._id || m.id) === msg.forwardedFrom);
                } else if (contextType === 'channel') {
                    Object.values(channelChatHistory).forEach(arr => {
                        if (!refMsg) refMsg = arr.find(m => (m._id || m.id) === msg.forwardedFrom);
                    });
                }
                msg.forwardedFromText = refMsg ? (refMsg.message || refMsg.content) : (msg.forwardedFromText || 'پیام قبلی');
                msg.forwardedFromUser = refMsg ? (refMsg.from || 'نامشخص') : (msg.forwardedFromUser || '');
            }
            return msg;
        }

        // نمایش فرم ساخت کانال و افزودن کاربر فقط برای کاربر A
        function renderChannelAdminPanel() {
            const panel = document.getElementById('channelAdminPanel');
            if (username !== 'A') {
                panel.innerHTML = '';
                return;
            }
            panel.innerHTML = `
                <div class="admin-panel">
                    <form id="createChannelForm" onsubmit="createChannel(event)">
                        <input type="text" id="newChannelName" placeholder="نام کانال جدید" required>
                        <button type="submit">ایجاد کانال</button>
                    </form>
                    <form id="addUserToChannelForm" onsubmit="addUserToChannel(event)">
                        <select id="selectChannelForAdd" required>
                            <option value="">انتخاب کانال...</option>
                            ${userChannels.map(c => `<option value="${c.name}">${c.name}</option>`).join('')}
                        </select>
                        <select id="selectUserForAdd" required>
                            <option value="">انتخاب کاربر...</option>
                            ${allUsers.filter(u => u.username !== 'A').map(u => `<option value="${u.username}">${u.username}</option>`).join('')}
                        </select>
                        <button type="submit">افزودن کاربر</button>
                    </form>
                    <div id="channelAdminMsg" class="admin-msg"></div>
                </div>
            `;
        }
        // ساخت کانال
        window.createChannel = function(e) {
            e.preventDefault();
            const name = document.getElementById('newChannelName').value.trim();
            if (!name) return;
            socket.emit('create-channel', name);
        }
        // افزودن کاربر به کانال
        window.addUserToChannel = function(e) {
            e.preventDefault();
            const channelName = document.getElementById('selectChannelForAdd').value;
            const usernameToAdd = document.getElementById('selectUserForAdd').value;
            if (!channelName || !usernameToAdd) return;
            socket.emit('add-user-to-channel', { channelName, usernameToAdd });
        }
        // مدیریت پیام‌های موفقیت/خطا
        socket.on('channel-created', channel => {
            document.getElementById('channelAdminMsg').textContent = `کانال «${channel.name}» با موفقیت ایجاد شد.`;
            document.getElementById('newChannelName').value = '';
        });
        socket.on('user-added-to-channel', data => {
            document.getElementById('channelAdminMsg').textContent = `کاربر «${data.username}» به کانال «${data.channelName}» اضافه شد.`;
        });
        socket.on('channel-error', msg => {
            document.getElementById('channelAdminMsg').textContent = msg;
        });
        // اگر کاربر به کانال جدید اضافه شد
        socket.on('added-to-channel', data => {
            // پیام اطلاع‌رسانی ساده
            alert(`شما به کانال «${data.channelName}» توسط ${data.addedBy} اضافه شدید.`);
        });

        // اتصال اولیه به چت
        socket.emit('join-chat', username);

        // تعریف تابع انتخاب کانال به صورت global
        window.selectChannel = function(channelName) {
            currentChannel = channelName;
            showChannelChatHistory();
            // اگر لازم است پیام‌های جدید را از سرور بگیریم، اینجا اضافه کنید
        };

        // توابع کمکی برای فوروارد:
        function getForwardOptions() {
            // لیست کاربران آنلاین (به جز خودت)
            const userOptions = allUsers.filter(u => u.username !== username).map(u => ({ value: 'user:' + u.username, label: 'کاربر: ' + u.username }));
            // گروه‌هایی که عضو هستی (در این پروژه فقط group-chat)
            const groupOptions = [{ value: 'group:group-chat', label: 'گروه عمومی' }];
            // کانال‌هایی که عضو هستی و اجازه ارسال داری (فرض: همه کانال‌هایی که عضو هستی)
            const channelOptions = userChannels.map(c => ({ value: 'channel:' + c.name, label: 'کانال: ' + c.name }));
            return [...userOptions, ...groupOptions, ...channelOptions];
        }

        // ارسال ریپلای
        window.sendReply = function(msgId, contextType) {
            const input = document.getElementById('replyInput_' + msgId);
            console.log('sendReply', { msgId, contextType, value: input ? input.value : undefined, replyToMessageId });
            if (!input || !input.value.trim()) return;
            // پیدا کردن پیام مرجع و افزودن به آرایه اگر نبود
            let refMsg = null;
            if (contextType === 'private') {
                Object.values(privateChatHistory).forEach(arr => {
                    if (!refMsg) refMsg = arr.find(m => (m._id || m.id) === msgId);
                });
                if (refMsg && !privateChatHistory[currentRecipient].some(m => (m._id || m.id) === msgId)) {
                    privateChatHistory[currentRecipient].push(refMsg);
                }
            }
            if (contextType === 'private') {
                document.getElementById('privateInput').value = input.value;
                replyToMessageId = msgId;
                sendPrivateMessage();
            } else if (contextType === 'group') {
                document.getElementById('groupInput').value = input.value;
                replyToMessageId = msgId;
                sendGroupMessage();
            } else if (contextType === 'channel') {
                document.getElementById('channelInput').value = input.value;
                replyToMessageId = msgId;
                sendChannelMessage();
            }
            clearReplyForward();
        };
        // ارسال فوروارد
        window.sendForward = function(msgId, contextType) {
            const select = document.getElementById('forwardSelect_' + msgId);
            console.log('sendForward', { msgId, contextType, value: select ? select.value : undefined, forwardFromMessageId });
            if (!select || !select.value) return;
            const [type, dest] = select.value.split(':');
            forwardFromMessageId = msgId;

            // پیدا کردن پیام مرجع برای فوروارد
            let refMsg = null;
            if (contextType === 'private') {
                Object.values(privateChatHistory).forEach(arr => {
                    if (!refMsg) refMsg = arr.find(m => (m._id || m.id) === msgId);
                });
            } else if (contextType === 'group') {
                refMsg = groupChatHistory.find(m => (m._id || m.id) === msgId);
            } else if (contextType === 'channel') {
                Object.values(channelChatHistory).forEach(arr => {
                    if (!refMsg) refMsg = arr.find(m => (m._id || m.id) === msgId);
                });
            }
            if (!refMsg) {
                alert('پیام مرجع برای فوروارد پیدا نشد!');
                return;
            }

            // ساخت پیام فوروارد برای اضافه کردن به تاریخچه خود کاربر
            const newMsg = {
                _id: Date.now().toString(),
                from: username,
                to: dest,
                content: refMsg.message || refMsg.content,
                type: type === 'user' ? 'private' : (type === 'group' ? 'group' : 'channel'),
                likes: [],
                timestamp: new Date().toISOString(),
                forwardedFrom: msgId
            };
            const enriched = enrichMessage(newMsg, type === 'user' ? 'private' : (type === 'group' ? 'group' : 'channel'));

            if (type === 'user') {
                document.getElementById('privateRecipient').value = dest;
                currentRecipient = dest;
                fetch('/api/message/private', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        from: username,
                        to: dest,
                        message: refMsg.message || refMsg.content,
                        forwardedFrom: msgId
                    })
                });
                if (!privateChatHistory[dest]) privateChatHistory[dest] = [];
                // اگر پیام مرجع در آرایه نبود، آن را اضافه کن
                if (refMsg && !privateChatHistory[dest].some(m => (m._id || m.id) === msgId)) {
                    privateChatHistory[dest].push(refMsg);
                }
                privateChatHistory[dest].push(enriched);
                showPrivateChatHistory();
            } else if (type === 'group') {
                switchTab('group');
                fetch('/api/message/group', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        from: username,
                        message: refMsg.message || refMsg.content,
                        forwardedFrom: msgId
                    })
                });
                // اگر پیام مرجع در آرایه نبود، آن را اضافه کن
                if (refMsg && !groupChatHistory.some(m => (m._id || m.id) === msgId)) {
                    groupChatHistory.push(refMsg);
                }
                groupChatHistory.push(enriched);
                showGroupChatHistory();
            } else if (type === 'channel') {
                selectChannel(dest);
                fetch('/api/message/channel', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        from: username,
                        channelName: dest,
                        message: refMsg.message || refMsg.content,
                        forwardedFrom: msgId
                    })
                });
                if (!channelChatHistory[dest]) channelChatHistory[dest] = [];
                // اگر پیام مرجع در آرایه نبود، آن را اضافه کن
                if (refMsg && !channelChatHistory[dest].some(m => (m._id || m.id) === msgId)) {
                    channelChatHistory[dest].push(refMsg);
                }
                channelChatHistory[dest].push(enriched);
                showChannelChatHistory();
            }
            clearReplyForward();
        };

        // TODO: مدیریت ساخت کانال و افزودن کاربر به کانال برای کاربر A
        // TODO: نمایش لیست کانال‌ها و انتخاب کانال فعال
        // TODO: مدیریت رویدادهای channel-created, added-to-channel, channel-error و ...
    </script>
</body>
